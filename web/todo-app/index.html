<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Todo — Vanilla JS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>📝 Ma liste de tâches</h1>

    <form id="todo-form" class="todo-form" autocomplete="off">
      <input type="text" id="todo-input" placeholder="Ajouter une tâche…" required maxlength="120" />
      <select id="todo-priority" aria-label="Priorité">
        <option value="basse">Basse</option>
        <option value="moyenne" selected>Moyenne</option>
        <option value="haute">Haute</option>
      </select>
      <button type="submit">Ajouter</button>
    </form>

    <div class="filters" role="group" aria-label="Filtres">
      <button data-filter="toutes" class="active">Toutes</button>
      <button data-filter="actives">Actives</button>
      <button data-filter="terminees">Terminées</button>
    </div>

    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

    <footer class="stats">
      <span id="stat-active">0 active</span> · <span id="stat-done">0 terminée</span>
      <button id="clear-done" class="link-btn">Effacer terminées</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
